<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="sparkle-lg">
      <path d="M0,-26 C2,-8 8,-2 26,0 C8,2 2,8 0,26 C-2,8 -8,2 -26,0 C-8,-2 -2,-8 0,-26 Z" />
    </g>
    <g id="sparkle-sm">
      <path d="M0,-13 C1,-4 4,-1 13,0 C4,1 1,4 0,13 C-1,4 -4,1 -13,0 C-4,-1 -1,-4 0,-13 Z" />
    </g>
    <g id="ringed-dot">
      <circle r="9" fill="none" stroke-width="1.4" />
      <circle r="2.6" />
    </g>
    <g id="dot"><circle r="2.4" /></g>
    <g id="dot-sm"><circle r="1.4" /></g>
    <g id="diamond-outline">
      <rect x="-6" y="-6" width="12" height="12" fill="none" stroke-width="1.2" transform="rotate(45)" />
    </g>
    <g id="tri-up"><polygon points="0,-9 8,7 -8,7" fill="none" stroke-width="1.3" /></g>
    <g id="tri-down"><polygon points="0,9 8,-7 -8,-7" fill="none" stroke-width="1.3" /></g>
    <g id="sq-outline"><rect x="-7" y="-7" width="14" height="14" fill="none" stroke-width="1.3" /></g>
    <g id="moon-crescent">
      <path d="M8,-11 A11,11 0 1 0 8,11 A8.5,9.5 0 1 1 8,-11 Z" />
    </g>
    <g id="moon-half">
      <circle r="9" fill="none" stroke-width="1.3" />
      <line x1="0" y1="-9" x2="0" y2="9" stroke-width="1.3" />
    </g>
  </defs>

  <g stroke="rgba(224,201,154,0.30)" fill="none">
    <!-- Top-right orbit swirl -->
    <circle cx="900" cy="-90" r="210" />
    <circle cx="900" cy="-90" r="330" stroke-dasharray="2 6" opacity="0.7" />
    <circle cx="900" cy="-90" r="450" stroke-dasharray="2 8" opacity="0.5" />

    <!-- Top-left corner arcs -->
    <circle cx="-90" cy="-40" r="160" opacity="0.8" />
    <circle cx="-90" cy="-40" r="260" stroke-dasharray="2 6" opacity="0.55" />

    <!-- Bottom-left corner arcs -->
    <circle cx="-70" cy="1400" r="220" opacity="0.8" />
    <circle cx="-70" cy="1400" r="340" stroke-dasharray="2 7" opacity="0.5" />

    <!-- Faint echo circle mid-canvas (keeps center airy) -->
    <circle cx="760" cy="690" r="480" opacity="0.12" />
  </g>

  <!-- Axis lines -->
  <g stroke="rgba(224,201,154,0.35)" stroke-width="1">
    <line x1="440" y1="258" x2="750" y2="258" />
    <line x1="690" y1="278" x2="690" y2="472" />
    <line x1="470" y1="1252" x2="750" y2="1252" />
  </g>

  <!-- Diagonal faint orbit-path echo -->
  <path d="M600,500 C650,610 660,740 680,850" stroke="rgba(224,201,154,0.16)" stroke-width="1" fill="none" />

  <!-- TOP-RIGHT cluster -->
  <g fill="#E0C99A" stroke="#E0C99A">
    <use href="#sparkle-lg" x="612" y="92" opacity="0.9" />
    <use href="#sparkle-sm" x="676" y="54" opacity="0.7" />
    <use href="#ringed-dot" x="558" y="182" opacity="0.85" />
    <use href="#dot" x="702" y="232" opacity="0.8" />
    <use href="#dot-sm" x="548" y="118" opacity="0.6" />
    <use href="#ringed-dot" x="620" y="258" opacity="0.9" />
    <use href="#ringed-dot" x="722" y="258" opacity="0.75" />
  </g>

  <!-- Alchemical glyph column (top right) -->
  <g fill="none" stroke="#E0C99A" opacity="0.85">
    <use href="#tri-up" x="690" y="300" />
    <use href="#tri-down" x="690" y="335" />
    <use href="#sq-outline" x="690" y="372" />
    <use href="#diamond-outline" x="690" y="408" />
    <use href="#sq-outline" x="690" y="444" />
  </g>

  <!-- TOP-LEFT cluster -->
  <g fill="#E0C99A" stroke="#E0C99A">
    <use href="#sparkle-sm" x="62" y="142" opacity="0.85" />
    <use href="#ringed-dot" x="112" y="92" opacity="0.75" />
    <use href="#diamond-outline" x="42" y="228" opacity="0.7" />
    <use href="#dot" x="30" y="262" opacity="0.6" />
    <use href="#dot-sm" x="150" y="40" opacity="0.5" />
  </g>

  <!-- Mid-canvas faint texture (sparse, keeps content legible) -->
  <g fill="#E0C99A" opacity="0.28">
    <use href="#dot-sm" x="200" y="600" />
    <use href="#dot-sm" x="650" y="748" />
    <use href="#dot-sm" x="300" y="820" />
    <use href="#dot-sm" x="120" y="700" />
  </g>

  <!-- BOTTOM-LEFT cluster -->
  <g fill="#E0C99A" stroke="#E0C99A">
    <use href="#sparkle-sm" x="140" y="1222" opacity="0.85" />
    <use href="#ringed-dot" x="60" y="1150" opacity="0.8" />
    <use href="#dot" x="100" y="1082" opacity="0.65" />
    <use href="#diamond-outline" x="40" y="1300" opacity="0.6" />
  </g>

  <!-- Moon phases column (left side, lower third) -->
  <g fill="#E0C99A" stroke="#E0C99A" opacity="0.85">
    <use href="#moon-crescent" x="40" y="985" />
    <use href="#moon-half" x="40" y="1025" fill="none" />
    <g transform="translate(40,1065) scale(-1,1)">
      <use href="#moon-crescent" x="0" y="0" />
    </g>
  </g>

  <!-- BOTTOM-RIGHT axis end -->
  <g fill="#E0C99A" stroke="#E0C99A">
    <use href="#moon-crescent" x="558" y="1252" opacity="0.7" />
    <use href="#ringed-dot" x="620" y="1252" opacity="0.85" />
    <use href="#dot-sm" x="700" y="1252" opacity="0.5" />
  </g>
</svg>
